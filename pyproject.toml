[project]
name = "thermground"
version = "0.1.0"
description = "Small vision-language model for grounded question answering on thermal UAV images."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pillow",
    "pyyaml",
]

[project.optional-dependencies]
viz = ["matplotlib"]
mlx = ["mlx-vlm>=0.7.12; sys_platform == 'darwin'"]  # Apple silicon inference only
# LoRA fine-tuning and transformers inference (CUDA, e.g. Colab)
train = ["torch>=2.5", "torchvision", "transformers>=4.57", "peft>=0.17"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermground"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
